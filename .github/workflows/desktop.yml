name: Build desktop installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: voice-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voice-os/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: Yabo-Assistant-${{ runner.os }}
          path: |
            voice-os/src-tauri/target/release/bundle/nsis/*.exe
            voice-os/src-tauri/target/release/bundle/msi/*.msi
            voice-os/src-tauri/target/release/bundle/deb/*.deb
            voice-os/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
